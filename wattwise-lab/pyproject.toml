[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattwise-lab"
version = "1.0.0"
description = "WATTWISE LAB: household electricity experiments (EV charging and appliance schedules) built on trialforge-core"
requires-python = ">=3.11"
dependencies = [
  "trialforge-core>=0.2.1,<0.3",   # install the wheel from ../skeleton/dist first (see README)
  "trialforge-db>=0.1.0",          # root database package (install from the repo root: pip install -e ..)
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "playwright>=1.40"]

[project.scripts]
wattwise-lab = "wattwise.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wattwise", "db"]
