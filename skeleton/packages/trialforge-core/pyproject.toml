[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialforge-core"
version = "0.2.0"
description = "A domain-independent experiment design, execution, analysis and optimisation SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TRIALFORGE contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "SQLAlchemy>=2.0,<3",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
optuna = ["optuna>=3.5"]                     # enables Optimizer(method="optuna")
test = ["pytest>=8", "pytest-asyncio>=0.23", "optuna>=3.5"]
verify = ["statsmodels>=0.14", "pandas>=2.0"]   # independent reference implementations used by cross-check tests
dev = ["trialforge-core[test,verify]", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trialforge = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:optuna"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E731", "E741", "SIM102"]
