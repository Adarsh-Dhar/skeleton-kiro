[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-setup-lab"
version = "1.0.0"
description = "F1 SETUP LAB: design-of-experiments workstation for (synthetic) vehicle setup, built on trialforge-core"
requires-python = ">=3.11"
dependencies = [
  "trialforge-core>=0.2.0,<0.3",   # install the wheel from ../skeleton/dist first (see README)
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "fastf1>=3.9.2,<4",              # historical F1 data provider (timing 2018 onwards)
  "pyarrow>=18",                   # parquet storage for normalized historical datasets
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "playwright>=1.40"]

[project.scripts]
f1-setup-lab = "f1lab.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
