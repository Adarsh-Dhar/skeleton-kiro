[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-setup-lab"
version = "2.1.0"
description = "F1 SETUP LAB: Setup Engineering, Live Simulator and Historical F1 workspaces, built on the TRIALFORGE SDK, with real historical data from OpenF1"
requires-python = ">=3.11"
dependencies = [
  "trialforge-core>=0.2.0,<0.3",   # TRIALFORGE SDK (installed from the SDK wheel)
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2",
  "pandas>=2",
  "numpy>=1.26",
  "certifi>=2024",                 # CA bundle for HTTPS to api.openf1.org (python.org builds on macOS ship without one)
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "playwright>=1.40", "hypothesis>=6"]

[project.scripts]
f1-setup-lab = "f1lab.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["f1lab", "db"]

[tool.ruff.lint.per-file-ignores]
# explicit == True/False on pandas nullable booleans is intentional in the tests
"tests/*.py" = ["E712"]
# compact one-line statements in packet/protocol decoders and the capture loop are intentional
"backend/f1lab/integrations/game_udp/protocols/*.py" = ["E702"]
"backend/f1lab/integrations/game_udp/capture.py" = ["E702"]
